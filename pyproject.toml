[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-bridge"
version = "0.1.0"
description = "Hardware Abstraction Layer for ESP32 to Jetson to Cloud"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/SuperInstance/vessel-bridge"

[tool.setuptools]
py-modules = ["bridge"]

[tool.setuptools.package-dir]
"" = "src"
